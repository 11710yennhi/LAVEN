spring.application.name=LAVEN

# ===== MariaDB =====
spring.datasource.url=jdbc:mariadb://${DB_HOST:}:${DB_PORT:}/${DB_NAME:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=optional:file:.env[.properties]

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Dia chi goc de ghep link trong email
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===== VietQR =====
payment.vietqr.bank-id=${BANK_ID:}
payment.vietqr.bank-name=${BANK_NAME:}
payment.vietqr.account-number=${BANK_ACCOUNT_NO:}
payment.vietqr.account-name=${BANK_ACCOUNT_NAME:}
payment.sepay-api-key=${SEPAY_API_KEY:}

# ===== Firebase chat =====
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}
firebase.auth-domain=${FIREBASE_AUTH_DOMAIN:}
firebase.database-url=${FIREBASE_DATABASE_URL:}
firebase.app-id=${FIREBASE_APP_ID:}

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:}

# ===== React (later stage) =====
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}

# ===== Scheduled (default 02:00 ) =====
app.jobs.cron=${APP_JOBS_CRON:0 0 2 * * *}

# ===== ADMIN account (created only if no ADMIN exists) =====
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

# ===== Multipart / File Upload =====
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB



# ===== Spring AI: Embedding (Gemini) =====
# Key lay tai https://aistudio.google.com/apikey, de trong file .env (khong commit)
# "missing-key" de app van khoi dong duoc khi chua co key
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:missing-key}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768
spring.ai.google.genai.embedding.text.options.task-type=SEMANTIC_SIMILARITY

# ===== Spring AI: Vector store MariaDB =====
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.table-name=product_vectors
spring.ai.vectorstore.mariadb.dimensions=768
spring.ai.vectorstore.mariadb.distance-type=COSINE

# Diem giong toi thieu (0..1); thap hon thi coi nhu khong lien quan
app.ai.min-similarity=0.55

# ===== Spring AI: Chatbot tu van (Gemini chat, dung chung GEMINI_API_KEY) =====
spring.ai.google.genai.api-key=${GEMINI_API_KEY:missing-key}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.3
# So cau hoi toi da moi ngay: khach chua dang nhap / tai khoan / toan he thong
app.ai.chat.guest-limit=3
app.ai.chat.user-limit=20
app.ai.chat.global-limit=400
# true khi chay sau proxy (ngrok, nginx): lay IP cuoi trong X-Forwarded-For
app.ai.chat.trust-proxy=false
